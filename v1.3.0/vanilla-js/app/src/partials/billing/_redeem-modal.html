<!-- Redeem code -->
<div
  class="modal fade"
  id="redeem-code"
  tabindex="-1"
  aria-labelledby="redeem-code-title"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered modal-sm">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="redeem-code-title">Redeem Code</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body py-0">
        <p class="fs-7 text-body-secondary mb-5">
          Enter a promo or gift code. Its value is added to your account credit and applied to your
          next invoice.
        </p>

        <label for="redeem-code-input" class="form-label">Code</label>
        <div class="form-icon mb-4">
          <i class="ph ph-ticket"></i>
          <input
            type="text"
            class="form-control text-uppercase"
            id="redeem-code-input"
            placeholder="e.g. SAVE20"
            autocomplete="off"
          />
        </div>

        <div class="d-flex align-items-center gap-2 fs-8 text-body-secondary">
          <i class="ph ph-wallet fs-4"></i>
          Current credit: <span class="text-body-emphasis fw-medium">$12.00</span>
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn link-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary">Redeem</button>
      </div>
    </div>
  </div>
</div>
