<!-- Add payment method -->
<div
  class="modal fade"
  id="add-payment-method"
  tabindex="-1"
  aria-labelledby="add-payment-method-title"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="add-payment-method-title">Add Payment Method</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body py-0">
        <nav class="nav nav-pills fs-7 mb-6" role="tablist">
          <button
            type="button"
            class="nav-link active d-flex align-items-center gap-2"
            id="payment-tab-card"
            data-bs-toggle="pill"
            data-bs-target="#payment-pane-card"
            role="tab"
            aria-controls="payment-pane-card"
            aria-selected="true"
          >
            <i class="ph ph-credit-card fs-5"></i>
            Card
          </button>
          <button
            type="button"
            class="nav-link d-flex align-items-center gap-2"
            id="payment-tab-paypal"
            data-bs-toggle="pill"
            data-bs-target="#payment-pane-paypal"
            role="tab"
            aria-controls="payment-pane-paypal"
            aria-selected="false"
          >
            <i class="ph ph-paypal-logo fs-5"></i>
            PayPal
          </button>
          <button
            type="button"
            class="nav-link d-flex align-items-center gap-2"
            id="payment-tab-bank"
            data-bs-toggle="pill"
            data-bs-target="#payment-pane-bank"
            role="tab"
            aria-controls="payment-pane-bank"
            aria-selected="false"
          >
            <i class="ph ph-bank fs-5"></i>
            Bank account
          </button>
        </nav>

        <div class="tab-content mb-5">
          <!-- Card -->
          <div
            class="tab-pane fade show active"
            id="payment-pane-card"
            role="tabpanel"
            aria-labelledby="payment-tab-card"
            tabindex="0"
          >
            <div class="row g-4">
              <div class="col-12">
                <label for="add-card-name" class="form-label">Name on card</label>
                <input
                  type="text"
                  class="form-control"
                  id="add-card-name"
                  placeholder="Catherine Williams"
                  autocomplete="cc-name"
                />
              </div>

              <div class="col-12">
                <label for="add-card-number" class="form-label">Card number</label>
                <div class="form-icon">
                  <i class="ph ph-credit-card"></i>
                  <input
                    type="text"
                    class="form-control"
                    id="add-card-number"
                    placeholder="1234 5678 9012 3456"
                    inputmode="numeric"
                    autocomplete="cc-number"
                  />
                </div>
              </div>

              <div class="col-7">
                <label for="add-card-expiry" class="form-label">Expiry date</label>
                <input
                  type="text"
                  class="form-control"
                  id="add-card-expiry"
                  placeholder="MM / YY"
                  inputmode="numeric"
                  autocomplete="cc-exp"
                />
              </div>

              <div class="col-5">
                <label for="add-card-cvc" class="form-label">CVC</label>
                <input
                  type="text"
                  class="form-control"
                  id="add-card-cvc"
                  placeholder="123"
                  inputmode="numeric"
                  autocomplete="cc-csc"
                />
              </div>

              <div class="col-7">
                <label for="add-card-country" class="form-label">Country</label>
                <select id="add-card-country" class="form-select" autocomplete="country-name">
                  <option selected>United States</option>
                  <option>Canada</option>
                  <option>United Kingdom</option>
                  <option>Germany</option>
                  <option>Australia</option>
                </select>
              </div>

              <div class="col-5">
                <label for="add-card-zip" class="form-label">ZIP code</label>
                <input
                  type="text"
                  class="form-control"
                  id="add-card-zip"
                  placeholder="48015"
                  autocomplete="postal-code"
                />
              </div>
            </div>
          </div>

          <!-- PayPal -->
          <div
            class="tab-pane fade"
            id="payment-pane-paypal"
            role="tabpanel"
            aria-labelledby="payment-tab-paypal"
            tabindex="0"
          >
            <div class="text-center px-4 py-6 rounded-3 bg-highlight">
              <div class="avatar avatar-lg bg-primary-subtle text-primary mx-auto mb-4">
                <i class="ph ph-paypal-logo fs-2"></i>
              </div>
              <div class="text-body-emphasis fw-medium mb-1">Connect your PayPal account</div>
              <p class="fs-7 text-body-secondary mb-0">
                You'll be redirected to PayPal to sign in and approve future payments. You can
                disconnect it at any time.
              </p>
            </div>
          </div>

          <!-- Bank account -->
          <div
            class="tab-pane fade"
            id="payment-pane-bank"
            role="tabpanel"
            aria-labelledby="payment-tab-bank"
            tabindex="0"
          >
            <div class="row g-4">
              <div class="col-12">
                <label for="add-bank-holder" class="form-label">Account holder</label>
                <input
                  type="text"
                  class="form-control"
                  id="add-bank-holder"
                  placeholder="Abacaus Apple Inc"
                  autocomplete="name"
                />
              </div>

              <div class="col-6">
                <label for="add-bank-routing" class="form-label">Routing number</label>
                <input
                  type="text"
                  class="form-control"
                  id="add-bank-routing"
                  placeholder="110000000"
                  inputmode="numeric"
                />
              </div>

              <div class="col-6">
                <label for="add-bank-type" class="form-label">Account type</label>
                <select id="add-bank-type" class="form-select">
                  <option selected>Checking</option>
                  <option>Savings</option>
                </select>
              </div>

              <div class="col-12">
                <label for="add-bank-account" class="form-label">Account number</label>
                <div class="form-icon">
                  <i class="ph ph-bank"></i>
                  <input
                    type="text"
                    class="form-control"
                    id="add-bank-account"
                    placeholder="000123456789"
                    inputmode="numeric"
                  />
                </div>
              </div>
            </div>
          </div>
        </div>

        <div class="form-check form-switch mb-5">
          <input class="form-check-input" type="checkbox" id="add-payment-default" checked />
          <label class="form-check-label" for="add-payment-default">
            Set as default payment method
          </label>
        </div>

        <div class="d-flex align-items-center gap-1 fs-8 text-body-secondary">
          <i class="ph ph-shield-check fs-4"></i>
          Payments are encrypted and processed securely.
        </div>
      </div>

      <div class="modal-footer">
        <button type="button" class="btn link-secondary" data-bs-dismiss="modal">Cancel</button>
        <button type="button" class="btn btn-primary">Add payment method</button>
      </div>
    </div>
  </div>
</div>

<!-- Edit payment method -->
<div
  class="modal fade"
  id="edit-payment-method"
  tabindex="-1"
  aria-labelledby="edit-payment-method-title"
  aria-hidden="true"
>
  <div class="modal-dialog modal-dialog-centered">
    <div class="modal-content">
      <div class="modal-header">
        <h2 class="modal-title fs-5" id="edit-payment-method-title">Edit Payment Method</h2>
        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>

      <div class="modal-body py-0">
        <div class="d-flex align-items-center gap-3 p-4 mb-6 rounded-3 bg-highlight">
          <div class="avatar bg-primary-subtle text-primary">
            <i class="ph ph-credit-card fs-4"></i>
          </div>
          <div class="flex-grow-1 lh-sm">
            <div class="text-body-emphasis fw-medium mb-1">Visa ending in 4242</div>
            <div class="fs-8 text-body-secondary">Added on March 12, 2026</div>
          </div>
          <span class="badge rounded-pill bg-success text-invert">Default</span>
        </div>

        <div class="row g-4">
          <div class="col-8">
            <label for="edit-card-name" class="form-label">Name on card</label>
            <input
              type="text"
              class="form-control"
              id="edit-card-name"
              value="Catherine Williams"
              autocomplete="cc-name"
            />
          </div>

          <div class="col-4">
            <label for="edit-card-expiry" class="form-label">Expiry date</label>
            <input
              type="text"
              class="form-control"
              id="edit-card-expiry"
              value="08 / 28"
              inputmode="numeric"
              autocomplete="cc-exp"
            />
          </div>

          <div class="col-12">
            <label for="edit-billing-email" class="form-label">Billing email</label>
            <input
              type="email"
              class="form-control"
              id="edit-billing-email"
              value="billing@abacaus-apple.app"
              autocomplete="email"
            />
          </div>

          <div class="col-12">
            <label for="edit-billing-address" class="form-label">Billing address</label>
            <input
              type="text"
              class="form-control"
              id="edit-billing-address"
              value="2810 D Street"
              autocomplete="street-address"
            />
          </div>

          <div class="col-5">
            <label for="edit-billing-city" class="form-label">City</label>
            <input
              type="text"
              class="form-control"
              id="edit-billing-city"
              value="Center Line"
              autocomplete="address-level2"
            />
          </div>

          <div class="col-4">
            <label for="edit-billing-state" class="form-label">State</label>
            <input
              type="text"
              class="form-control"
              id="edit-billing-state"
              value="Michigan"
              autocomplete="address-level1"
            />
          </div>

          <div class="col-3">
            <label for="edit-billing-zip" class="form-label">ZIP</label>
            <input
              type="text"
              class="form-control"
              id="edit-billing-zip"
              value="48015"
              autocomplete="postal-code"
            />
          </div>

          <div class="col-12">
            <label for="edit-tax-id" class="form-label">Tax ID</label>
            <input type="text" class="form-control" id="edit-tax-id" value="US EIN 47-2938105" />
          </div>
        </div>
      </div>

      <div class="modal-footer">
        <a href="" class="link-danger px-1">Remove card</a>
        <button type="button" class="btn link-secondary ms-auto" data-bs-dismiss="modal">
          Cancel
        </button>
        <button type="button" class="btn btn-primary">Save changes</button>
      </div>
    </div>
  </div>
</div>
