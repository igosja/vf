<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-start mb-5">
      <h5 class="card-title m-0 d-flex align-items-center flex-grow-1 gap-3">
        <div
          class="avatar avatar-md text-pink bg-pink d-none d-sm-grid"
          style="--bs-bg-opacity: 0.15"
        >
          <i class="ph ph-pulse fs-4"></i>
        </div>

        Product Engagement
      </h5>

      <div class="d-flex gap-px mt-n2 me-n1">
        <a href="" class="icon ph ph-info"></a>
        <a href="" class="icon ph ph-download-simple d-none d-sm-flex"></a>
      </div>
    </div>

    <div class="row row-cols-2 row-cols-md-4 g-3 mb-6 lh-sm">
      <div class="col">
        <div class="h-100 py-3 px-4 border rounded-3 d-flex flex-column">
          <div class="d-flex align-items-center gap-2 fs-7 text-body-secondary mb-2">
            Daily active users
            <i class="bg-pink w-2 h-2 ms-auto rounded-circle flex-shrink-0"></i>
          </div>
          <div class="fs-4 text-body-emphasis mt-auto lh-1">1,284</div>
        </div>
      </div>
      <div class="col">
        <div class="h-100 py-3 px-4 border rounded-3 d-flex flex-column">
          <div class="d-flex align-items-center gap-2 fs-7 text-body-secondary mb-2">
            Monthly active users
            <i class="bg-primary w-2 h-2 ms-auto rounded-circle flex-shrink-0"></i>
          </div>
          <div class="fs-4 text-body-emphasis mt-auto lh-1">2,906</div>
        </div>
      </div>
      <div class="col d-none d-md-block">
        <div class="h-100 py-3 px-4 border rounded-3 d-flex flex-column">
          <div class="d-flex align-items-center gap-2 fs-7 text-body-secondary mb-2">
            Stickiness (DAU/MAU)
            <i class="bg-success ms-auto w-2 h-2 rounded-circle flex-shrink-0"></i>
          </div>
          <div class="fs-4 text-success lh-1">44%</div>
        </div>
      </div>
      <div class="col d-none d-md-block">
        <div class="h-100 py-3 px-4 border rounded-3 d-flex flex-column">
          <div class="d-flex align-items-center gap-2 fs-7 text-body-secondary mb-2">
            Avg. session
            <i class="bg-warning w-2 h-2 ms-auto rounded-circle flex-shrink-0"></i>
          </div>
          <div class="fs-4 text-body-emphasis mt-auto lh-1">18m 42s</div>
        </div>
      </div>
    </div>

    <div class="chart chart-md mb-5">
      <canvas id="chart-product-engagement"></canvas>
    </div>

    <ul class="chart-legends">
      <li>
        <i class="bg-pink"></i>
        Daily active users
      </li>
      <li>
        <i class="bg-primary"></i>
        Weekly active users
      </li>
    </ul>
  </div>
</div>
