<div class="card">
  <div class="card-body">
    <div class="d-flex align-items-start mb-3">
      <h5 class="card-title m-0 d-flex align-items-center flex-grow-1 gap-3">
        <div
          class="avatar avatar-md text-warning bg-warning d-none d-sm-grid"
          style="--bs-bg-opacity: 0.15"
        >
          <i class="ph ph-calculator fs-4 mt-0.5"></i>
        </div>

        Unit Economics
      </h5>

      <div class="mt-n2 me-n1">
        <a href="" class="icon ph ph-info"></a>
      </div>
    </div>

    <div class="mb-n2">
      <div class="d-flex align-items-start gap-3 py-3.5 border-bottom">
        <i class="ph ph-heart-straight fs-4 mt-0.5"></i>
        <div class="flex-grow-1 text-body-emphasis">Customer lifetime value</div>
        <div class="fs-7 d-none d-sm-flex align-items-center text-success">
          8.2%
          <i class="ph ph-arrow-circle-up fs-5 ms-1"></i>
        </div>
        <div class="fs-5 text-body-emphasis w-16 text-end">$1,840</div>
      </div>
      <div class="d-flex align-items-start gap-3 py-3.5 border-bottom">
        <i class="ph ph-currency-circle-dollar fs-4 mt-0.5"></i>
        <div class="flex-grow-1 text-body-emphasis">Customer acquisition cost</div>
        <div class="fs-7 d-none d-sm-flex align-items-center text-danger">
          3.5%
          <i class="ph ph-arrow-circle-down fs-5 ms-1"></i>
        </div>
        <div class="fs-5 text-body-emphasis w-16 text-end">$412</div>
      </div>
      <div class="d-flex align-items-start gap-3 py-3.5 border-bottom">
        <i class="ph ph-percent fs-4 mt-0.5"></i>
        <div class="flex-grow-1 text-body-emphasis">LTV : CAC ratio</div>
        <div class="fs-7 d-none d-sm-flex align-items-center text-success">
          0.4x
          <i class="ph ph-arrow-circle-up fs-5 ms-1"></i>
        </div>
        <div class="fs-5 text-body-emphasis w-16 text-end">4.5x</div>
      </div>
      <div class="d-flex align-items-start gap-3 py-3.5 border-bottom">
        <i class="ph ph-calendar-dots fs-4 mt-0.5"></i>
        <div class="flex-grow-1 text-body-emphasis">CAC payback period</div>
        <div class="fs-7 d-none d-sm-flex align-items-center text-danger">
          0.8 mo
          <i class="ph ph-arrow-circle-down fs-5 ms-1"></i>
        </div>
        <div class="fs-5 text-body-emphasis w-16 text-end">6.2 mo</div>
      </div>
      <div class="d-flex align-items-start gap-3 py-3.5 border-bottom">
        <i class="ph ph-clock-countdown fs-4 mt-0.5"></i>
        <div class="flex-grow-1 text-body-emphasis">Net revenue retention</div>
        <div class="fs-7 d-none d-sm-flex align-items-center text-success">
          2.1%
          <i class="ph ph-arrow-circle-up fs-5 ms-1"></i>
        </div>
        <div class="fs-5 text-body-emphasis w-16 text-end">112%</div>
      </div>
      <div class="d-flex align-items-start gap-3 py-3.5">
        <i class="ph ph-chart-pie fs-4 mt-0.5"></i>
        <div class="flex-grow-1 text-body-emphasis">SaaS quick ratio</div>
        <div class="fs-7 d-none d-sm-flex align-items-center text-success">
          0.3
          <i class="ph ph-arrow-circle-up fs-5 ms-1"></i>
        </div>
        <div class="fs-5 text-body-emphasis w-16 text-end">3.8</div>
      </div>
    </div>
  </div>
</div>
